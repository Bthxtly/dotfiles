[osd]
offset_y = 12
orientation = "vertical"
position = "top_right"
position_vertical = "center_right"

[plugins]
enabled = [ "noctalia/bongocat", "fel/ocr" ]

[shell]
avatar_path = "/home/bthxtly/Pictures/Avatars/avatar.jpg"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Rose Pine Moon Alt"
mode = "light"
source = "community"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "qt" ]

[wallpaper]
directory = "/home/bthxtly/Pictures/Wallpapers"
transition = [ "disc" ]
transition_duration = 700

    [wallpaper.default]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

    [wallpaper.last]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

    [wallpaper.monitors.DP-1]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

[widget.cat]
input_devices = [
    "/dev/input/event24",
    "/dev/input/by-path/pci-0000:00:15.0-platform-i2c_designware.0-event-mouse",
    "/dev/input/by-id/usb-Logitech_G102_LIGHTSYNC_Gaming_Mouse_2066354D5942-event-mouse"
]
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.cpu]
visualization = "none"

[widget.date]
vertical_format = "{:%a\\n%m\\n%d}"

[widget.media]
hide_when_no_media = true
scale = 1.5
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ram]
label_show_units = false

    [widget.ram.actions]
    right = "exec kitty --app-id kitty-widget btm -b"

[widget.session]
enabled = false

[widget.volume.actions]
scroll_down = "volume-up 3"
scroll_up = "volume-down 3"

[widget.workspaces]
hide_when_empty = true
scale = 1.2
show_labels = false