config_version = 15

[audio]
enable_sounds = true

[bar.default]
capsule = true
capsule_opacity = 0.59999998658895493
capsule_radius = 8
center = [ "group:g5", "group:g4", "weather", "caffeine" ]
end = [ "group:g2", "group:g3", "group:g1", "control-center", "session" ]
margin_edge = 4
margin_ends = 64
margin_opposite_edge = 4
padding = 10
position = "right"
start = [ "launcher", "wallpaper", "workspaces", "tray" ]
thickness = 48
widget_spacing = 8

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"
    right = "settings-open"
    scroll_left = "volume-up 1"
    scroll_right = "volume-down 1"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "brightness", "battery" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "notifications", "clipboard", "network", "bluetooth" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "cpu", "ram" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "date", "clock" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "media", "cat" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

[brightness]
enable_ddcutil = true

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
enabled = true
icon_size = 36
launcher_position = "start"
reserve_space = false
show_dots = true
smart_auto_hide = true

[hooks]
session_unlocked = "sudo systemctl restart daed"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
auto_locate = true

