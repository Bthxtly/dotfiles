[osd]
offset_y = 12
orientation = "vertical"
position = "top_right"
position_vertical = "center_right"

[shell]
avatar_path = "/home/bthxtly/Pictures/Profiles/profile.jpg"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Rose Pine Moon Alt"
mode = "light"
source = "community"
wallpaper_scheme = "m3-rainbow"

[wallpaper]
directory = "/home/bthxtly/Pictures/Wallpapers"
transition = [ "disc" ]
transition_duration = 700

    [wallpaper.default]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

    [wallpaper.last]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/bthxtly/.local/state/noctalia/wallpapers/light.png"

[widget.clipboard]
enabled = false

[widget.clock]
scale = 0.94999999999999996

[widget.control-center]
enabled = false

[widget.cpu]
visualization = "none"

[widget.date]
vertical_format = "{:%m\\n%d\\n%a}"

[widget.launcher]
enabled = false

[widget.media]
hide_when_no_media = true
scale = 1.5
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ram]
label_show_units = false
visualization = "none"

[widget.session]
enabled = false

[widget.volume.actions]
scroll_down = "volume-up 3"
scroll_up = "volume-down 3"

[widget.workspaces]
hide_when_empty = true
scale = 1.2
show_labels = false