config_version = 13

[bar.default]
capsule = true
capsule_opacity = 0.59999998658895493
capsule_radius = 8
center = [ "media", "group:g4", "weather" ]
end = [ "group:g2", "group:g3", "group:g1", "control-center", "session" ]
margin_edge = 2
margin_ends = 2
padding = 0
position = "right"
start = [ "launcher", "wallpaper", "workspaces", "tray" ]
thickness = 42
widget_spacing = 8

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"
    right = "settings-open"
    scroll_left = "volume-up 3"
    scroll_right = "volume-down 3"

    [bar.default.monitor.HDMI]
    enabled = false

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "brightness", "battery" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "notifications", "clipboard", "network", "bluetooth" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "cpu", "ram" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "date", "clock" ]
    opacity = 0.59999996423721313
    padding = 6.0
    radius = 8.0

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
enabled = true
launcher_position = "start"
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "Qingtian, China"

[lockscreen]
lock_before_suspend = false

